[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-copilot"
version = "0.1.0"
description = "Synthetic-data-first ecommerce analytics and compliance copilot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
data = [
  "Faker>=30,<40",
]
rag = [
  "rank-bm25>=0.2,<1",
  "sentence-transformers>=3,<6",
  "sqlite-vec>=0.1.6,<1",
]
agent = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "sqlglot>=26,<32",
]
gateway = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "tenacity>=9,<10",
  "uvicorn[standard]>=0.32,<1",
]
dev = [
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
no_implicit_optional = true
